<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Save to your iPhone</title>
<link rel="stylesheet" href="/_upload/app.css">
<link rel="stylesheet" href="/_save/save.css">
</head>
<body>
<header class="mast">
  <a class="mark" href="/">files</a>
  <p class="ident" id="who">checking sign-in</p>
</header>
<main>
  <nav class="crumbs"><a id="back" href="/">Back to your files</a></nav>
  <h1 id="title">Save to your iPhone</h1>
  <p class="lede" id="lede">Looking for your photos…</p>
  <section id="months" aria-label="Months"></section>
  <p class="hint" id="howto" hidden>Each part is about 50 photos or 500 MB, so your phone can hold it while it saves. Videos come in parts of their own.</p>
</main>
<section id="job" class="job" hidden aria-live="polite">
  <div class="job-title" id="jobTitle"></div>
  <div class="bar"><span id="jobBar"></span></div>
  <div class="job-state" id="jobState"></div>
  <div class="job-actions">
    <button id="jobSave" type="button" hidden></button>
    <a id="jobZip" class="folder" hidden>Download a zip instead</a>
    <button id="jobCancel" type="button" class="quiet">Cancel</button>
  </div>
</section>
<script src="/_save/save.js"></script>
</body>
</html>
