<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upload to your folder</title>
<link rel="stylesheet" href="/_upload/app.css">
</head>
<body>
<header class="mast">
  <a class="mark" href="/">files</a>
  <p class="ident" id="who">checking sign-in</p>
</header>
<main>
  <h1>Upload to your folder</h1>
  <p class="lede" id="lede">Checking your sign-in…</p>
  <label class="pick" id="pickLabel" hidden>
    Choose photos, videos or contacts
    <input id="pick" type="file" multiple accept="image/*,video/*,.vcf,text/vcard,text/x-vcard">
  </label>
  <p class="hint" id="hint" hidden>Keep this page open until every file says Done. If the connection drops, tap Retry: finished parts are kept.</p>
  <ul id="files"></ul>
  <p id="summary" role="status"></p>
  <div class="actions">
    <button id="retry" type="button" hidden>Retry</button>
    <a class="folder" id="folder" hidden>Open your folder</a>
  </div>
</main>
<script src="/_upload/app.js"></script>
</body>
</html>
